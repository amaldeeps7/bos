# Business OS: Postgres + Redis + API + web, plus Mailpit to catch outgoing email.
#   cp .env.example .env   (optional: add ANTHROPIC_API_KEY, or a real SMTP_URL)
#   docker compose up --build
# Open http://localhost:3000 and sign in as priya@democonsulting.in / demo1234.
# Every email the app sends (invoices, quotes, reminders, invites, meeting invites) shows up at http://localhost:8025.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bos
      POSTGRES_PASSWORD: bos
      POSTGRES_DB: bos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bos"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Holds queued background jobs as well as caches: keep it on disk and never evict keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      # The API runs as bos_app (no BYPASSRLS), so Postgres row-level security isolates organisations.
      # Migrations, the role setup and the demo seed use the owner.
      DATABASE_URL: postgresql://bos_app:${APP_DB_PASSWORD:-bos_app}@db:5432/bos?schema=public
      MIGRATE_DATABASE_URL: postgresql://bos:bos@db:5432/bos?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MFA_KEY: ${MFA_KEY:-}
      # Plain http on localhost here; set COOKIE_SECURE=true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Browser -> web (Next proxies /api) -> api: two hops.
      TRUST_PROXY: 2
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      WEB_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Demo Consulting <billing@democonsulting.in>}
      PORT: 4000
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    ports: ["4000:4000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: http://api:4000 }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  storage:
